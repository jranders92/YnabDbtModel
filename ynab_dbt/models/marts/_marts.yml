# used for testing changes to dim categories logic
models:
  - name: dim_categories
    latest_version: 2
    versions:
      - v: 1
      # initial version
      - v: 2
       # added budgeted amount column from staging
    description: >
      Categories dimension table

  - name: fct_monthly_budget_variance
    latest_version: 2
    versions:
      - v: 1
      # initial version
      - v: 2
       # changed category ref from staging to fct
    description: >
      Monthly budget variance facts table
    tests:
      - dbt_utils.equality:
          arguments:
            compare_model: source('analytics_prod', 'fct_monthly_budget_variance')

  - name: fct_monthly_grocery_inflation
    description: >
      Monthly grocery inflation facts table
    tests:
      - dbt_utils.equality:
          arguments:
            compare_model: source('analytics_prod', 'fct_monthly_grocery_inflation')

