models:
  - name: dim_date
    columns:
      - name: date_day
        tests:
          - unique
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "cast('2023-01-01' as date)"
                max_value: "cast('2030-01-01' as date)"

  - name: fct_monthly_budget_variance
    columns:
      - name: budget_variance_sk
        tests:
          - unique
          - not_null
      - name: category_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_categories')
                field: category_id
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - category_id
              - budget_month

  - name: fct_monthly_gas_inflation
    columns:
      - name: gas_inflation_sk
        tests:
          - unique
          - not_null
      - name: month_date
        tests:
          - not_null
      - name: fred_series_id
        tests:
          - not_null
      - name: total_gas_spent
        tests:
          - not_null
      - name: transaction_count
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - month_date
              - fred_series_id




