sources:
  - name: raw
    description: Raw transactions from YNAB
    database: personal_finance
    schema: raw
    tables:
      - name: raw_fred_payloads
        config:
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after: 
              count: 48
              period: hour
        columns:
          - name: series_id
            description: Fred Series ID
            tests:
              - not_null

          - name: extracted_at
            description: time extracted and loaded from api call  

          - name: payload
            description: Raw JSON payload from FRED API
