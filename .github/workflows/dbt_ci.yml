name: dbt Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

env:
  # Secrets configured in GitHub Repository -> Settings -> Secrets and variables -> Actions
  DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.DBT_SNOWFLAKE_ACCOUNT }}
  DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
  DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
  
  # Generates an isolated schema name per PR (e.g., ci_pr_12)
  DBT_CI_SCHEMA: "ci_pr_${{ github.event.number }}"

jobs:
  dbt_ci_build:
    name: Run Slim CI and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ynab_dbt

    steps:
      # Step 1: Fetch the repository source code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      # Step 3: Install dbt and Snowflake adapter
      - name: Install dbt Dependencies
        run: |
          pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Create default profiles.yml on GitHub Runner
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          ynab_dbt:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "${DBT_SNOWFLAKE_ACCOUNT}"
                user: "${DBT_SNOWFLAKE_USER}"
                password: "${DBT_SNOWFLAKE_PASSWORD}"
                role: ynab_dbt_role
                database: PERSONAL_FINANCE
                warehouse: COMPUTE_WH
                schema: "${DBT_CI_SCHEMA}"
                threads: 16
          EOF

      # Step 4: Install dbt hub packages (dbt_utils, etc.)
      - name: Install dbt packages
        run: dbt deps

      # Step 5: Download manifest.json from the latest successful main/prod run
      - name: Download Production Manifest Artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          branch: main
          workflow: dbt_prod.yml  # Name of your production workflow file
          name: prod-manifest
          path: ./state
        continue-on-error: true  # Falls back cleanly if no production manifest exists yet

      # Step 6: Execute Slim CI (build & test modified models + downstream children)
      - name: Run Slim CI Build
        run: |
          if [ -f "./state/manifest.json" ]; then
            echo "Production manifest found. Running Slim CI on state:modified+..."
            dbt build --target ci --select state:modified+ --state ./state
          else
            echo "No production manifest found. Running full project build..."
            dbt build --target ci
          fi

      # Step 7: Drop the temporary PR schema (Runs ALWAYS, even if Step 6 fails)
      - name: Drop Ephemeral CI Schema (Cleanup)
        if: always()
        run: |
          echo "Cleaning up temporary schema: $DBT_CI_SCHEMA"
          dbt run-operation drop_schema_if_exists --args "{schema_name: $DBT_CI_SCHEMA}" --target ci
          dbt run-operation drop_schema_if_exists --args "{schema_name: ${DBT_CI_SCHEMA}_staging}" --target ci
          dbt run-operation drop_schema_if_exists --args "{schema_name: ${DBT_CI_SCHEMA}_snapshots}" --target ci
          
