name: dbt Production

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.DBT_SNOWFLAKE_ACCOUNT }}
  DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
  DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}

jobs:
  dbt_prod_build:
    name: Run Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ynab_dbt

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          ynab_dbt:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: "${DBT_SNOWFLAKE_ACCOUNT}"
                user: "${DBT_SNOWFLAKE_USER}"
                password: "${DBT_SNOWFLAKE_PASSWORD}"
                role: ynab_dbt_role
                database: PERSONAL_FINANCE
                warehouse: COMPUTE_WH
                schema: analytics_prod
                threads: 16
          EOF

      - name: Install dbt packages
        run: dbt deps  
      
      - name: Run dbt seed
        run: dbt seed --target prod --full-refresh

      - name: Run dbt build
        run: dbt build --target prod --exclude resource_type:seed

      - name: Upload manifest for Slim CI
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prod-manifest
          path: ./ynab_dbt/target/manifest.json
          retention-days: 7

      - name: Generate dbt docs
        # Omits catalog statistics such as row counts and column statistics.
        run: dbt docs generate --empty-catalog

      - name: Deploy docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./ynab_dbt/target
          publish_branch: gh-pages

